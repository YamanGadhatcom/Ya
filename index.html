<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنصة الطبية الذكية | الطوارئ والتوعية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      --text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 0.9rem; opacity: 0.9; }

    .content { padding: 25px; }

    .input-group { margin-bottom: 18px; }
    
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }

    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: none;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: var(--primary-hover); }
    button:active { transform: scale(0.99); }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border-right: 4px solid var(--primary);
      border-radius: 6px;
      min-height: 80px;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .disclaimer {
      margin-top: 20px;
      padding: 10px;
      background: #fffbebf5;
      border: 1px solid #fef3c7;
      color: #92400e;
      border-radius: 6px;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🩺 المساعد الطبي الذكي</h1>
      <p>استشارات وتوعية صحية فورية مدعومة بالذكاء الاصطناعي</p>
    </div>

    <div class="content">
      <div class="input-group">
        <label for="userPrompt">صف الأعراض أو اطرح استفسارك الطبي:</label>
        <textarea id="userPrompt" placeholder="مثال: أشعر بصداع خفيف في الجهة الأمامية مع إجهاد في العينين..."></textarea>
      </div>

      <button onclick="askDoctor()">إرسال الاستفسار</button>

      <div class="result-box" id="resultBox">في انتظار استفسارك الطبية...</div>

      <div class="disclaimer">
        ⚠️ <strong>تنبيه طبي:</strong> هذه الخدمة للتوعية والتثقيف الطبي فقط، ولا تُغني بأي حال من الأحوال عن استشارة الطبيب المختص أو زيارة المشفى.
      </div>
    </div>
  </div>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // 🔴 ضع مفتاحك الخاص بين التنصيص هنا
    const API_KEY = "AQ.Ab8RN6LkIQBV1tGB-053SQHeM8Du7jW4GqfOOKfZkt8153O3Fw";

    window.askDoctor = async function() {
      const prompt = document.getElementById("userPrompt").value.trim();
      const resultBox = document.getElementById("resultBox");

      if (!prompt) {
        alert("يرجى كتابة السؤال أو الأعراض أولاً!");
        return;
      }

      resultBox.innerText = "جاري تحليل الأعراض وصياغة النصائح...";

      try {
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ 
          model: "gemini-1.5-flash",
          systemInstruction: `أنت مساعد طبي للتوعية والتعليم فقط. 
          1. أجب بأسلوب سلس، مرتب وموثوق.
          2. اذكر الاحتمالات المباشرة والأسباب الشائعة للأعراض بدون إثارة الذعر.
          3. قدم نصائح أولية أو خطوات للرعاية الذاتية.
          4. اختم دائماً بالتنبيه بأهمية رؤية الطبيب إذا استمرت الأعراض.`
        });

        const result = await model.generateContent(prompt);
        resultBox.innerText = result.response.text();
      } catch (error) {
        resultBox.innerText = "حدث خطأ أثناء الاتصال: " + error.message;
      }
    };
  </script>

</body>
</html>
